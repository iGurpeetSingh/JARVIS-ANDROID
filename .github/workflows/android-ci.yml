name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jarvis-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run native C++ command engine tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            app/src/main/cpp/native-lib.cpp tests/command_engine_test.cpp \
            -o "$RUNNER_TEMP/jarvis-command-tests"
          "$RUNNER_TEMP/jarvis-command-tests"

      - name: Prepare native C++ ASR dependencies
        run: bash scripts/prepare-native-deps.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify C++-only application sources
        shell: bash
        run: |
          if find app/src/main -type f \( -name '*.kt' -o -name '*.java' \) | grep -q .; then
            echo "Kotlin/Java application source found. This repository must remain native C++."
            find app/src/main -type f \( -name '*.kt' -o -name '*.java' \)
            exit 1
          fi
          if grep -R -nE 'org\.jetbrains\.kotlin|kotlin-android|composeOptions|androidx\.compose' --include='*.gradle' --include='*.gradle.kts' .; then
            echo "Kotlin or Compose Gradle dependency found."
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify unsigned release builds are rejected
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/jarvis-release-signing-check.log"
          if gradle --no-daemon :app:assembleRelease >"$LOG_FILE" 2>&1; then
            echo "An unsigned release build unexpectedly succeeded."
            cat "$LOG_FILE"
            exit 1
          fi
          if ! grep -q "Release signing is required" "$LOG_FILE"; then
            echo "Release failed for an unexpected reason."
            cat "$LOG_FILE"
            exit 1
          fi
          echo "Unsigned release build was correctly rejected."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
